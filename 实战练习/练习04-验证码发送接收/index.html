<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>验证码界面</title>
    <link rel="stylesheet" href="../练习04-验证码发送接收/style.css">
</head>
    <div class="container">
        <h1>请输入验证码登录</h1>
        <div class="form-item">
            <label for="phone">手机号</label>
            <input type="text" id="phone" placeholder="请输入手机号">
        </div>

        <!--一个div里的元素都在同一行-->
        <div class="form-item code-item">
            <label for="code">验证码</label>
            <input type="text" id="code" placeholder="请输入验证码">
            <button id="getCodeButton">获取验证码</button>
        </div>

        <button id="loginButton">验证登录</button>
        
        <p id="message"><!--用JS代码动态生成登录成功与否--></p>
    </div>
    <!--模拟发送验证码：在控制台查看验证码-->
<body>
    <script src="../练习04-验证码发送接收/verification-code.js"></script>
</body>
</html>
